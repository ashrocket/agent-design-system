name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Install optional static TSX parser
        run: npm ci --prefix src/agent_design_system/adapters/tsx --ignore-scripts --no-audit --no-fund
      - name: Select trusted Node binary for the optional parser
        run: echo "ADSF_NODE_BIN=$(command -v node)" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check formatting
        run: ruff format --check src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Type-check
        run: mypy src/agent_design_system
      - name: Validate example system
        run: adsys validate examples/aurora.design-system.json
      - name: Check passing example
        run: adsys check examples/aurora.design-system.json examples/button.valid.json
      - name: Run normative conformance suite
        run: adsys conformance
      - name: Verify assistant CSS source workflow
        run: python scripts/verify-css-workflow.py
      - name: Verify pinned project-wide CSS gate
        run: python scripts/verify-project-workflow.py
      - name: Verify static TSX source profile
        run: python scripts/verify-tsx-workflow.py
      - name: Verify failing example fails
        run: |
          if adsys check examples/aurora.design-system.json examples/button.invalid.json; then
            echo "invalid example unexpectedly passed" >&2
            exit 1
          fi
