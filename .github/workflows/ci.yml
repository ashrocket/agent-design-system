name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check formatting
        run: ruff format --check src tests
      - name: Lint
        run: ruff check src tests
      - name: Type-check
        run: mypy src/agent_design_system
      - name: Validate example system
        run: adsys validate examples/aurora.design-system.json
      - name: Check passing example
        run: adsys check examples/aurora.design-system.json examples/button.valid.json
      - name: Run normative conformance suite
        run: adsys conformance
      - name: Verify failing example fails
        run: |
          if adsys check examples/aurora.design-system.json examples/button.invalid.json; then
            echo "invalid example unexpectedly passed" >&2
            exit 1
          fi
